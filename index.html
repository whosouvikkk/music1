<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali Songs for Gen-Z</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for English and Hindi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+Devanagari:wght@600;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for elegant minimal icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Background Layers -->
    <div class="bg-base"></div>
    <div class="bg-gradient"></div>
    <div class="bg-grain"></div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Main Application UI -->
    <div class="app-container">
        
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="time-display" id="ind-time">--:-- --</div>
            <div class="status-indicator">
                <span class="dot"></span>
                <span>Bengali Songs for Gen-Z</span>
            </div>
            <a href="https://youtube.com/playlist?list=PLQMOvIibwSoQ&si=jXQvsK4Dy1bY4weI" target="_blank" class="glass-btn icon-btn" aria-label="Open Playlist">
                <i class="ph ph-playlist"></i>
            </a>
        </header>

        <!-- Center Visual & Text -->
        <main class="hero-section">
            <h1 class="hindi-title">বাংলা চটপটে গান</h1>
            <div class="cinematic-visual">
                <!-- Using a high-quality atmospheric truck/highway placeholder image -->
                <img src="bengali.png" alt="Bengali Music">
                <div class="visual-overlay"></div>
            </div>
            <h2 class="hindi-tagline">दम है तो क्रॉस कर, नहीं तो बर्दाश्त कर।</h2>
        </main>

        <!-- Glassmorphism Music Player -->
        <footer class="music-player glass-panel">
            
            <div class="player-info">
                <div class="artwork-container">
                    <img id="track-art" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Album Art">
                    <div class="artwork-glow" id="track-art-glow"></div>
                </div>
                <div class="track-details">
                    <h3 id="track-title" class="truncate">Loading the highway...</h3>
                    <p id="track-artist" class="truncate">Please wait</p>
                </div>
            </div>

            <div class="player-controls">
                
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <div class="progress-bar-wrapper" id="progress-wrapper">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>

                <div class="control-buttons">
                    <button class="glass-btn small-btn" id="btn-shuffle" aria-label="Toggle Shuffle">
                        <i class="ph-fill ph-shuffle"></i>
                    </button>
                    
                    <button class="glass-btn" id="btn-prev" aria-label="Previous Song">
                        <i class="ph-fill ph-skip-back"></i>
                    </button>
                    
                    <button class="glass-btn play-btn" id="btn-play-pause" aria-label="Play or Pause">
                        <i class="ph-fill ph-play" id="icon-play-pause"></i>
                    </button>
                    
                    <button class="glass-btn" id="btn-next" aria-label="Next Song">
                        <i class="ph-fill ph-skip-forward"></i>
                    </button>
                    
                    <!-- Mobile only fallback playlist link if needed, hidden on desktop -->
                    <a href="https://youtube.com/playlist?list=PLQMOvIibwSoQ&si=jXQvsK4Dy1bY4weI" target="_blank" class="glass-btn small-btn mobile-playlist" aria-label="Open Playlist">
                        <i class="ph ph-list"></i>
                    </a>
                </div>

            </div>
        </footer>
    </div>

    <!-- Application Logic -->
    <script src="script.js"></script>
</body>
</html>
